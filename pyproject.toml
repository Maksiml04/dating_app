[project]
name = "date-ideas-mvp"
version = "0.24.0"
description = "Телеграм-бот рекомендаций свиданий — MVP"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "alembic>=1.13,<2", "pydantic>=2.8,<3", "pydantic-settings>=2.4,<3", "httpx>=0.27,<1", "pgvector>=0.3,<1", "sqladmin>=0.21,<1", "python-multipart>=0.0.9,<1", "itsdangerous>=2.2,<3", "boto3>=1.34,<2", "greenlet>=3.0,<4"]
[project.optional-dependencies]
telegram = ["telethon>=1.36,<2"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.7,<1", "aiosqlite>=0.20,<1", "PyYAML>=6,<7"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["e2e: requires isolated PostgreSQL dateideas_test and fake Telegram transport"]
[tool.ruff]
line-length = 110

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*", "alembic*", "docs*"]
